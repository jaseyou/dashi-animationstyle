<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>扁平流程图 · Three.js 正交等轴测沙盘模板</title>
<!--
  扁平流程图（Three.js 正交等轴测微缩沙盘 + 原作者奶油琥珀信息图版式）：
    第 1 层（奶油底景）：#fcf9ec 奶油暖底 + 视差慢转浅灰钟面圆环 + 漂浮浅色小几何
    第 2 层（正交等轴测 3D 沙盘）：OrthographicCamera 黄金等轴测视角 + warmDaylight 阳光柔光棚 + 暖色日光软阴影 + 光面圆角积木工位与立体琥珀传送管
    第 3 层（信息图版式顶）：琥珀编号圆标站名 stepLabel + 3D→2D 细黑折线琥珀说明框 amberCallout3D + 顶部琥珀标题带 + 马克笔高亮字幕 + 色块横扫/圆洞转场
-->
<style>
  html, body { margin: 0; padding: 0; background: #fcf9ec; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
  #gl { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="c" width="1920" height="1080"></canvas>
</div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script src="three.min.js"></script>
<script src="three_craft.js"></script>
<script>
'use strict';
const FX_DEFAULT = true;
const W = 1920, H = 1080, TAU = Math.PI * 2;
const FONT_HEAVY = '"MiSans", "Lantinghei SC", "PingFang SC", sans-serif';
const FONT_BODY = '"MiSans", "PingFang SC", sans-serif';
const font = (w, s) => `${w} ${s}px ${w >= 800 ? FONT_HEAVY : FONT_BODY}`;
const TL = window.TL;
const NOSUB = /[?&]nosub=1/.test(location.search);

const C = {
  bg: '#fcf9ec', paper: '#fffdf6', amber: '#fbbf2f', amber2: '#f7a30e', amberD: '#e08a06', amberL: '#fde7a0',
  ring: '#efe8d6', shadow: '#e9dbb4', ink: '#1a1410', ink2: '#2b241b', mute: '#7d7363',
  red: '#d41928', blue: '#2373ce', orange: '#ee8013', green: '#4f9d34', gold: '#d98e04',
};
const HEX3 = {
  paper: 0xfffdf5, cream: 0xf6efdc, amber: 0xfbbf2f, amberDeep: 0xe6920c,
  red: 0xd41928, blue: 0x2373ce, green: 0x4f9d34, orange: 0xee8013, ink: 0x241d17, slate: 0x434a54,
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.65, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const bump = (t, a, d) => Math.sin(Math.PI * P(t, a, d));
const hasMark = (k) => (typeof TL.has === 'function' ? TL.has(k) : !!(TL.marks && TL.marks[k]));
const MS = (k, dflt) => (hasMark(k) ? TL.mark(k) : dflt);
const SHOT_SRC = (TL.shots && TL.shots.length) ? TL.shots : [{ id: 1, start: 0, end: TL.duration, title: TL.title || '', keywords: [] }];

const cv = document.getElementById('c');
const g = cv.getContext('2d');
const glCv = document.getElementById('gl');
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { g.save(); g.font = f; v = g.measureText(s).width; g.restore(); wCache.set(k, v); } return v; }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(s, x, y, f, col, align = 'center', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
function resetCtx(x) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  x.lineCap = 'butt'; x.lineJoin = 'miter'; x.lineWidth = 1; x.setLineDash([]);
  x.shadowColor = 'rgba(0,0,0,0)'; x.shadowBlur = 0; x.shadowOffsetX = 0; x.shadowOffsetY = 0;
}

// ---------- 第 1 层：原作者奶油纸底 + 慢转浅灰钟面 + 视差漂浮几何 ----------
const BG_COLS = ['#f8e2a6', '#f6d9bd', '#dcead0', '#efe3c2', '#fbe9b8'];
const SHAPES = Array.from({ length: 26 }, (_, i) => {
  const h = (k) => 动效.hash(i * 9.13 + k * 3.71);
  return { x: h(1) * 2300, y: 155 + h(2) * 700, r: 9 + h(3) * 18, kind: Math.floor(h(4) * 4), col: BG_COLS[Math.floor(h(5) * BG_COLS.length)], ph: h(6) * TAU, spin: (h(7) - 0.5) * 1.1, v: 8 + h(8) * 12 };
});
function drawCreamBackdrop(t, worldX) {
  g.fillStyle = C.bg;
  g.fillRect(0, 0, W, H);
  // 视差钟面圆环
  for (let i = 0; i < SHOT_SRC.length + 1; i++) {
    const sx = 520 + i * 1150 - worldX * 72;
    const sy = i % 2 === 0 ? 450 : 590;
    if (sx < -460 || sx > W + 460) continue;
    g.save();
    g.strokeStyle = C.ring; g.lineCap = 'round';
    g.lineWidth = 4; g.beginPath(); g.arc(sx, sy, 360, 0, TAU); g.stroke();
    g.lineWidth = 11;
    const rot = t * 0.1 + i * 0.5;
    for (let k = 0; k < 12; k++) {
      const a = k * TAU / 12 - Math.PI / 2 + rot, r0 = 296, r1 = k % 3 === 0 ? 336 : 324;
      g.beginPath(); g.moveTo(sx + Math.cos(a) * r0, sy + Math.sin(a) * r0); g.lineTo(sx + Math.cos(a) * r1, sy + Math.sin(a) * r1); g.stroke();
    }
    const hs = t * 0.85 + i * 1.7, hm = t * 0.15 + i * 2.3;
    g.strokeStyle = C.shadow; g.lineWidth = 9;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(hm) * 170, sy + Math.sin(hm) * 170); g.stroke();
    g.lineWidth = 5; g.beginPath(); g.moveTo(sx - Math.cos(hs) * 35, sy - Math.sin(hs) * 35); g.lineTo(sx + Math.cos(hs) * 260, sy + Math.sin(hs) * 260); g.stroke();
    g.fillStyle = C.shadow; g.beginPath(); g.arc(sx, sy, 14, 0, TAU); g.fill();
    g.restore();
  }
  // 漂浮浅色小几何
  const mod = (v, m) => ((v % m) + m) % m;
  for (const s of SHAPES) {
    const x = mod(s.x - worldX * 48 - s.v * t, 2300) - 180, y = s.y + 8 * Math.sin(0.9 * t + s.ph);
    if (y > 880 || y < 130) continue;
    g.save(); g.translate(x, y); g.rotate(s.ph + s.spin * t); g.fillStyle = s.col; g.strokeStyle = s.col;
    const r = s.r;
    if (s.kind === 0) { g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); }
    else if (s.kind === 1) { g.lineWidth = 6; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke(); }
    else if (s.kind === 2) { rrect(-r, -r, 2 * r, 2 * r, r * 0.35); g.fill(); }
    else { const a = r * 0.34; g.fillRect(-r, -a, 2 * r, 2 * a); g.fillRect(-a, -r, 2 * a, 2 * r); }
    g.restore();
  }
}

// ---------- 第 2 层：Three.js 正交等轴测微缩沙盘 ----------
const stage3D = Craft3D.createStage(glCv, {
  ortho: true,
  frustumHeight: 7.4,
  studio: 'warmDaylight',
  exposure: 0.96,
  shadows: true,
  ambientColor: 0xfff3d6,
  ambientIntensity: 0.32,
  keyColor: 0xfff8ea,
  keyIntensity: 2.35,
  fillColor: 0xf5c96b,
  fillIntensity: 0.48,
  rimColor: 0xffeec8,
  rimIntensity: 0.55,
});
const { renderer, scene, camera, lights } = stage3D;
// 扩大正交阴影范围覆盖横向流水线各站
lights.key.shadow.camera.left = -22;
lights.key.shadow.camera.right = 22;
lights.key.shadow.camera.top = 16;
lights.key.shadow.camera.bottom = -16;
lights.key.shadow.camera.far = 48;
lights.key.shadow.camera.updateProjectionMatrix();

// 透明接收暖褐色日光软阴影的地面（ShadowMaterial 让阴影直接落在奶油纸底上！）
const shadowGround = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 40),
  new THREE.ShadowMaterial({ color: 0x8a6d32, opacity: 0.16 })
);
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.position.y = -1.25;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

const STATION_GAP = 10.8;
const STATION_GROUPS = SHOT_SRC.map((_, i) => {
  const grp = new THREE.Group();
  grp.position.set(i * STATION_GAP, 0, 0);
  scene.add(grp);
  return grp;
});

// 等轴测工位圆角白瓷台座生成器
function createIsoPlatform(w = 5.2, d = 3.6, h = 0.28) {
  const grp = new THREE.Group();
  const base = new THREE.Mesh(
    Craft3D.roundedBoxGeo(w, h, d, 0.11, 4),
    Craft3D.Materials.clay(HEX3.paper, { roughness: 0.35, clearcoat: 0.45 })
  );
  base.position.y = -1.1;
  base.castShadow = true;
  base.receiveShadow = true;
  grp.add(base);

  const rim = new THREE.Mesh(
    Craft3D.roundedBoxGeo(w + 0.12, h * 0.42, d + 0.12, 0.12, 3),
    Craft3D.Materials.clay(HEX3.amber, { roughness: 0.28 })
  );
  rim.position.y = -1.21;
  rim.receiveShadow = true;
  grp.add(rim);
  return grp;
}

// 站与站之间的立体琥珀传送桥 + 流动光面圆珠
const INTER_BRIDGES = [];
for (let i = 0; i < SHOT_SRC.length - 1; i++) {
  const x0 = i * STATION_GAP + 2.75, x1 = (i + 1) * STATION_GAP - 2.75;
  const br = Craft3D.createEnergyStream(
    [x0, -0.75, 0], [(x0 + x1) * 0.5, 0.65, -0.4], [x1, -0.75, 0],
    { color: HEX3.amberDeep, radius: 0.055, pulses: 3, intensity: 1.1 }
  );
  scene.add(br);
  INTER_BRIDGES.push(br);
}

let _worldCamX = 0;
function setIsoCam(worldX, worldZ = 0, zoom = 1.0, yawOffset = 0) {
  _worldCamX = worldX;
  const isoAngle = 0.58 + yawOffset;
  const dist = 16.0;
  camera.position.set(worldX + Math.sin(isoAngle) * dist, 10.2, worldZ + Math.cos(isoAngle) * dist);
  camera.lookAt(worldX, -0.15, worldZ);
  camera.zoom = zoom;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  lights.key.position.set(worldX + 6.5, 13.5, 7.5);
  lights.key.target.position.set(worldX, -0.5, 0);
  lights.key.target.updateMatrixWorld();
}

// ---------- 第 3 层：原作者琥珀编号圆标站名 + 3D→2D 细黑折线琥珀说明框 + 标题带与字幕 ----------
function badge(x, y, n, s = 1, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = C.shadow; g.beginPath(); g.arc(4, 5, 29, 0, TAU); g.fill();
  g.fillStyle = C.amber;
  g.beginPath(); g.moveTo(20, -15); g.lineTo(43, 0); g.lineTo(20, 15); g.closePath(); g.fill();
  g.beginPath(); g.arc(0, 0, 29, 0, TAU); g.fill();
  text(String(n), 0, 2, font(900, 34), '#ffffff');
  g.restore();
}

function drawStationBadge(sh, t) {
  const p = P(t, sh.start, 0.35), s = 0.7 + 0.3 * outBack(p);
  const shortT = String(sh.title || '').split(/[：:，,。！？!?]/)[0] || `步骤 ${sh.i + 1}`;
  g.save(); g.globalAlpha = clamp(p * 2, 0, 1);
  badge(112, 184, sh.i + 1, s);
  text(shortT, 174, 186, font(900, 48), C.ink, 'left');
  g.restore();
}

// 琥珀圆角说明框 + 2.5px 细黑折线锚定 3D 构件（原作者 S19 灵魂部件）
let _amberNotes = [];
function amberCallout3D(wx, wy, wz, label, subText, progress = 1, opts = {}) {
  if (progress <= 0.01 || !label) return;
  _amberNotes.push({ wx, wy, wz, label, subText, p: clamp(progress, 0, 1), opts });
}
function flushAmberNotes() {
  const cols = { '-1': [], '1': [] };
  _amberNotes.forEach((n, idx) => {
    const pt = Craft3D.projectToHUD(camera, n.wx, n.wy, n.wz, W, H);
    if (!pt.visible) return;
    const ax = clamp(pt.x, 150, W - 150), ay = clamp(pt.y, 170, H - 210);
    const fTitle = font(900, 36), fSub = font(600, 25);
    const w1 = tw(n.label, fTitle), w2 = n.subText ? tw(n.subText, fSub) : 0;
    const bw = Math.max(w1, w2) + 46, bh = n.subText ? 94 : 64;
    const dx = n.opts.dx ?? (ax < W * 0.5 ? -210 : 210);
    const dy = n.opts.dy ?? -115;
    const cx = clamp(ax + dx, bw / 2 + 64, W - bw / 2 - 64);
    const wantCy = clamp(ay + dy, 235 + bh / 2, 865 - bh / 2);
    const side = cx < W * 0.5 ? '-1' : '1';
    cols[side].push({ n, idx, ax, ay, fTitle, fSub, bw, bh, cx, cy: wantCy, wantCy });
  });
  for (const side of ['-1', '1']) {
    const list = cols[side];
    if (list.length > 1) {
      list.sort((a, b) => (a.wantCy - b.wantCy) || (a.idx - b.idx));
      const minY = 275, maxY = 825, gap = Math.min(108, (maxY - minY) / Math.max(1, list.length - 1));
      list[0].cy = Math.max(minY, list[0].wantCy);
      for (let i = 1; i < list.length; i++) list[i].cy = Math.max(list[i].wantCy, list[i - 1].cy + gap);
      if (list[list.length - 1].cy > maxY) {
        list[list.length - 1].cy = maxY;
        for (let i = list.length - 2; i >= 0; i--) list[i].cy = Math.min(list[i].cy, list[i + 1].cy - gap);
      }
    }
    for (const item of list) {
      const { n, ax, ay, fTitle, fSub, bw, bh, cx, cy } = item;
      const edgeX = cx + (ax > cx ? bw / 2 : -bw / 2);
      const midX = lerp(ax, edgeX, 0.45);
      const qLine = outC(clamp(n.p * 1.4, 0, 1));
      g.save();
      g.strokeStyle = C.ink2; g.lineWidth = 2.6; g.lineJoin = 'round';
      const seg1 = Math.hypot(midX - ax, cy - ay), seg2 = Math.abs(edgeX - midX), tot = seg1 + seg2;
      g.setLineDash([tot * qLine, tot + 20]);
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(midX, cy); g.lineTo(edgeX, cy); g.stroke();
      g.setLineDash([]);
      g.fillStyle = C.ink2; g.beginPath(); g.arc(ax, ay, 5.5, 0, TAU); g.fill();

      const boxP = clamp((n.p - 0.12) / 0.88, 0, 1);
      if (boxP > 0) {
        const sc = 0.78 + 0.22 * outBack(boxP);
        g.translate(cx, cy); g.scale(sc, sc); g.globalAlpha = boxP;
        const bgCol = n.opts.kind === 'red' ? C.red : n.opts.kind === 'blue' ? C.blue : C.amber;
        const txCol = (n.opts.kind === 'red' || n.opts.kind === 'blue') ? '#ffffff' : C.ink;
        const subCol = (n.opts.kind === 'red' || n.opts.kind === 'blue') ? 'rgba(255,255,255,0.86)' : C.ink2;
        g.fillStyle = C.shadow; rrect(-bw / 2 + 6, -bh / 2 + 8, bw, bh, 14); g.fill();
        g.fillStyle = bgCol; rrect(-bw / 2, -bh / 2, bw, bh, 14); g.fill();
        g.strokeStyle = 'rgba(26,20,16,0.14)'; g.lineWidth = 2; rrect(-bw / 2, -bh / 2, bw, bh, 14); g.stroke();
        if (n.subText) {
          text(n.label, 0, -14, fTitle, txCol);
          text(n.subText, 0, 22, fSub, subCol);
        } else {
          text(n.label, 0, 2, fTitle, txCol);
        }
      }
      g.restore();
    }
  }
  _amberNotes = [];
}

function drawHeader() {
  g.fillStyle = C.amber; g.fillRect(0, 0, W, 112);
  g.fillStyle = 'rgba(160,100,0,0.12)'; g.fillRect(0, 112, W, 5);
  if (TL.title) text(TL.title, 84, 58, font(900, 58), C.ink, 'left');
}

const ROLE = { A: C.red, B: C.blue };
const SUB_HL = [...(TL.emphasis || []).map((w) => [w]), ...(TL.highlights || []).map((h) => [h.text, ROLE[h.role] || C.red])]
  .filter(([w]) => w).sort((a, b) => b[0].length - a[0].length);
function subIn(c, t, d) { const k = TL.cues.indexOf(c), prev = k > 0 ? TL.cues[k - 1] : null; return prev && prev.hide >= c.show - 1e-3 ? 1 : P(t, c.show, d); }
function drawSubtitle(t) {
  if (NOSUB) return;
  const c = TL.cueAt(t); if (!c) return;
  const str = c.text, base = font(800, 64), w0 = tw(str, base);
  const size = w0 > 1800 ? Math.floor(64 * 1800 / w0) : 64;
  const a = subIn(c, t, 0.08), f = font(800, size), y = 993;
  const x0 = W / 2 - tw(str, f) / 2;
  const segs = []; let j = 0, plain = '';
  while (j < str.length) {
    const m = SUB_HL.find(([w]) => str.startsWith(w, j));
    if (m) { if (plain) { segs.push([plain]); plain = ''; } segs.push(m); j += m[0].length; } else { plain += str[j]; j++; }
  }
  if (plain) segs.push([plain]);
  g.save(); g.globalAlpha = a;
  let xx = x0;
  for (const [s, col] of segs) {
    const ww = tw(s, f);
    if (SUB_HL.some(([w, c0]) => w === s && !c0)) { g.fillStyle = 'rgba(251,191,47,0.85)'; rrect(xx - 6, y + 2, ww + 12, 30, 8); g.fill(); }
    xx += ww;
  }
  xx = x0; g.font = f; g.textBaseline = 'middle'; g.textAlign = 'left';
  for (const [s, col] of segs) { g.fillStyle = col || C.ink; g.fillText(s, xx, y); xx += tw(s, f); }
  g.restore();
}

let SHOTS = [];
function initShotsMeta() {
  SHOTS = SHOT_SRC.map((s, i) => ({
    s, i,
    start: i === 0 ? 0 : s.start,
    end: SHOT_SRC[i + 1] ? SHOT_SRC[i + 1].start : TL.duration,
    title: s.title || '',
    keywords: s.keywords || [],
  }));
}
function shotAt(t) {
  let k = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i].start) k = i;
  return SHOTS[k];
}

// ===== 场景：按新分镜重写（buildScene3D 初始化各站等轴测沙盘 + updateStation3D 逐帧纯函数更新） =====
let _built3D = false;
function buildScene3D() {
  const palette = [HEX3.red, HEX3.blue, HEX3.orange, HEX3.green, HEX3.amberDeep];
  SHOTS.forEach((sh, i) => {
    const grp = STATION_GROUPS[i];
    grp.add(createIsoPlatform(5.4, 3.6, 0.28));
    const kws = (sh.keywords || []).filter(Boolean);
    const blocks = kws.map((w, j) => {
      const x = (j - (kws.length - 1) / 2) * 1.25;
      const m = new THREE.Mesh(
        Craft3D.roundedBoxGeo(0.95, 0.65, 0.95, 0.1, 4),
        Craft3D.Materials.clay(palette[(i + j) % palette.length])
      );
      m.position.set(x, -0.58, 0);
      m.castShadow = m.receiveShadow = true;
      grp.add(m);
      return { w, m, x, t0: MS(w, sh.start + 0.3 + j * 0.4) };
    });
    grp.userData = { blocks };
  });
}

function updateStation3D(sh, t, u) {
  // 镜头沿横向流水线平滑横移换站 + 站内微旋转呼吸
  let wx = 0;
  for (let i = 1; i < SHOTS.length; i++) {
    wx = lerp(wx, i * STATION_GAP, inOutC(P(t, SHOTS[i].start - 0.32, 0.68)));
  }
  setIsoCam(wx, 0, 1.0 + 0.08 * sine(u), Math.sin(t * 0.35) * 0.06);

  SHOTS.forEach((st, idx) => {
    const { blocks } = STATION_GROUPS[idx].userData;
    blocks.forEach((b, j) => {
      const p = outBack(P(t, b.t0 - 0.05, 0.38));
      b.m.scale.setScalar(Math.max(0.001, p));
      b.m.position.y = -0.58 + Math.sin(t * 2.2 + j) * 0.06;
      if (idx === sh.i && p > 0.2) {
        amberCallout3D(idx * STATION_GAP + b.x, -0.15, 0, b.w, '', P(t, b.t0, 0.35), {
          dy: -105 - (j % 2) * 45,
        });
      }
    });
  });
}
// ===== 场景结束 =====

function render(t) {
  if (!SHOTS.length) initShotsMeta();
  if (!_built3D) { buildScene3D(); _built3D = true; }
  _amberNotes = [];

  const sh = shotAt(t);
  const dur = Math.max(0.4, sh.end - sh.start);
  const u = P(t, sh.start, dur);

  INTER_BRIDGES.forEach((br, idx) => {
    br.userData.update(t, P(t, SHOTS[idx].end - 0.8, 0.5), 0.75, idx * 0.3);
  });
  updateStation3D(sh, t, u);
  renderer.render(scene, camera);

  resetCtx(g);
  drawCreamBackdrop(t, _worldCamX);
  g.drawImage(glCv, 0, 0, W, H);
  flushAmberNotes();
  drawStationBadge(sh, t);
  drawHeader();
  drawSubtitle(t);
}

window.DURATION = TL.duration;
window.ready = false;
window.seek = (t) => render(t);
Promise.all([font(900, 58), font(800, 64), font(600, 26)].map((f) => document.fonts.load(f, '字幕Ag01')))
  .catch(() => {}).then(() => { initShotsMeta(); render(0); window.ready = true; });
</script>
