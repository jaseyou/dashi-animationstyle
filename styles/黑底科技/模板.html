<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>黑底科技 · Three.js 电影级双层通用模板</title>
<!--
  黑底科技（Three.js 摄影棚 + 原作者胶片合成三明治架构）：
    第 1 层（2D 胶片氛围底）：深藏青近黑 + 胶片细颗粒 + 远景星尘 + 十字准星坐标网格 + 慢转椭圆金轨 + 暖金呼吸主光晕
    第 2 层（WebGL 摄影棚 3D）：cinemaGold 五灯位 HDR 环境反射 + PCFSoftShadowMap 真实软阴影 + 45° 精雕倒角金属/黑曜石/朱砂/折射水晶 + 双级光学泛光 Bloom
    第 3 层（2D 高清版式顶）：3D→2D 靶心折线引线标注 callout3D + 散景虚化光斑 Bokeh + 暗角 + 左上里程表滚轮编号 + 底部衬线逐字虚化字幕
-->
<style>
  html, body { margin: 0; padding: 0; background: #05070b; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
  #gl { display: none; } /* 离屏渲染后经 compositeBloom 合成进主画布 #c */
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="c" width="1920" height="1080"></canvas>
</div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script src="three.min.js"></script>
<script src="three_craft.js"></script>
<script>
'use strict';
const FX_DEFAULT = true;
const W = 1920, H = 1080, TAU = Math.PI * 2;
const TL = window.TL;
const NOSUB = /[?&]nosub=1/.test(location.search);

// ---------- 原作者典藏衬线字体栈 ----------
const F_CN = '"Source Han Serif SC", "Songti SC", "STSong", serif';
const F_LAT = '"Baskerville", "Source Han Serif SC", "Songti SC", serif';
const fcn = (w, s) => `${w} ${s}px ${F_CN}`;
const flat = (w, s, it) => `${it ? 'italic ' : ''}${w} ${s}px ${F_LAT}`;

// ---------- 原作者黑金典藏色板 ----------
const C = {
  bg0: '#05070b', bg1: '#0b0f15', bg2: '#090d13',
  glow: [68, 53, 30],
  gold: '#e5cf95',
  goldHi: '#faefcc', goldLt: '#f2e3b8', goldMid: '#ddc994', goldDeep: '#ae915c', goldDk: '#5e4f32',
  coin1: '#f7e9bc', coin2: '#e5ca89', coin3: '#cdac6a', coin4: '#b28e4f', coin5: '#8c6330',
  line: '#c1bea8', line2: '#a19c85', line3: '#746f61', rule: '#554e39',
  cream: '#e2dfd3', white: '#f1efe4', gray: '#9a9385', gray2: '#625b52',
  card: '#1a1713', cardLine: '#373334',
  red: '#b1312a', redDk: '#962621', redTx: '#fee5d5', redLn: '#fcd0c0',
  ink: '#1a130a',
};

const ROLE_KIND = { A: 'red', B: 'gold' };
const kindOf = (w) => { const h = (TL.highlights || []).find((x) => x.text === w); return h ? (ROLE_KIND[h.role] || 'red') : 'dark'; };
const hasMark = (k) => (typeof TL.has === 'function' ? TL.has(k) : !!(TL.marks && TL.marks[k]));
const MS = (k, dflt) => (hasMark(k) ? TL.mark(k) : dflt);
const SHOT_SRC = (TL.shots && TL.shots.length) ? TL.shots : [{ id: 1, start: 0, end: TL.duration, title: TL.title || '', keywords: [] }];

// ---------- 数学与缓动 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p, k = 1.4) => 1 + (k + 1) * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2);
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const bump = (t, a, d) => Math.sin(Math.PI * P(t, a, d));
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const [r, gg, b] = Array.isArray(h) ? h : hex(h); return `rgba(${r},${gg},${b},${a})`; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const cv = document.getElementById('c');
const g = cv.getContext('2d');
const glCv = document.getElementById('gl');
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { g.save(); g.font = f; v = g.measureText(s).width; g.restore(); wCache.set(k, v); } return v; }
function text(s, x, y, f, col, align = 'center', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function resetCtx(x) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  x.lineCap = 'butt'; x.lineJoin = 'miter'; x.lineWidth = 1; x.setLineDash([]);
  x.shadowColor = 'rgba(0,0,0,0)'; x.shadowBlur = 0; x.shadowOffsetX = 0; x.shadowOffsetY = 0;
  x.imageSmoothingEnabled = true;
}

function goldGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.goldHi); gr.addColorStop(0.42, C.goldMid); gr.addColorStop(0.78, C.goldDeep); gr.addColorStop(1, C.coin5);
  return gr;
}
function coinGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.coin1); gr.addColorStop(0.35, C.coin2); gr.addColorStop(0.75, C.coin3); gr.addColorStop(1, C.coin4);
  return gr;
}

function revealText(str, x, y, f, fill, t, t0, opts = {}) {
  const { align = 'center', dur = 0.22, stag = 0.035, blur = 7, dy = 10, glow = 0, glowCol = null, alpha = 1 } = opts;
  if (alpha <= 0 || t < t0) return;
  const total = tw(str, f);
  const x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  g.save(); g.font = f; g.textAlign = 'left'; g.textBaseline = 'middle';
  const done = t >= t0 + stag * (str.length - 1) + dur;
  if (glow > 0) { g.shadowColor = glowCol || rgba(C.gold, 0.5); g.shadowBlur = glow; }
  g.fillStyle = typeof fill === 'function' ? fill() : fill;
  if (done) { g.globalAlpha = alpha; g.fillText(str, x0, y); g.restore(); return; }
  let xx = x0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], cw = tw(ch, f), p = P(t, t0 + i * stag, dur);
    if (p > 0) {
      const q = outC(p);
      g.globalAlpha = alpha * q;
      if (q < 0.98) g.filter = `blur(${((1 - q) * blur).toFixed(2)}px)`;
      g.fillText(ch, xx, y + (1 - q) * dy);
      g.filter = 'none';
    }
    xx += cw;
  }
  g.restore();
}

// ---------- 第 1 层：原作者胶片颗粒、星尘、十字坐标纸与暖金呼吸光晕 ----------
const FX = 960, FY = 485, BG_BOTTOM = 905;
const BG = mkCanvas(W, H);
(() => {
  const b = BG.getContext('2d');
  const lg = b.createLinearGradient(0, 0, W * 0.4, H);
  lg.addColorStop(0, C.bg1); lg.addColorStop(0.55, C.bg2); lg.addColorStop(1, C.bg0);
  b.fillStyle = lg; b.fillRect(0, 0, W, H);
  const gw = W / 2, gh = H / 2, gc = mkCanvas(gw, gh), gx = gc.getContext('2d'), id = gx.createImageData(gw, gh), rnd = mulberry32(7);
  for (let i = 0; i < gw * gh; i++) { const v = rnd() * 255; id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 13; }
  gx.putImageData(id, 0, 0);
  b.imageSmoothingEnabled = false; b.drawImage(gc, 0, 0, W, H);
})();
const VIG = mkCanvas(W, H);
(() => {
  const v = VIG.getContext('2d'), rg = v.createRadialGradient(W / 2, H * 0.45, H * 0.36, W / 2, H * 0.45, H * 1.04);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.72, 'rgba(1,2,4,0.32)'); rg.addColorStop(1, 'rgba(1,2,4,0.72)');
  v.fillStyle = rg; v.fillRect(0, 0, W, H);
})();
const GLOW = mkCanvas(512, 512);
(() => {
  const x = GLOW.getContext('2d'), rg = x.createRadialGradient(256, 256, 0, 256, 256, 256);
  rg.addColorStop(0, rgba(C.glow, 0.72)); rg.addColorStop(0.38, rgba(C.glow, 0.38)); rg.addColorStop(0.72, rgba(C.glow, 0.12)); rg.addColorStop(1, rgba(C.glow, 0));
  x.fillStyle = rg; x.fillRect(0, 0, 512, 512);
})();
const SPOT = mkCanvas(128, 128);
(() => {
  const x = SPOT.getContext('2d'), rg = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,246,222,1)'); rg.addColorStop(0.18, 'rgba(250,236,200,0.75)'); rg.addColorStop(0.5, 'rgba(229,207,149,0.22)'); rg.addColorStop(1, 'rgba(229,207,149,0)');
  x.fillStyle = rg; x.fillRect(0, 0, 128, 128);
})();
const BOKEH = mkCanvas(64, 64);
(() => {
  const x = BOKEH.getContext('2d'), rg = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(226,208,168,0.85)'); rg.addColorStop(0.55, 'rgba(226,208,168,0.42)'); rg.addColorStop(1, 'rgba(226,208,168,0)');
  x.fillStyle = rg; x.fillRect(0, 0, 64, 64);
})();
const SUBBAND = mkCanvas(W, 240);
(() => {
  const x = SUBBAND.getContext('2d'), lg = x.createLinearGradient(0, 0, 0, 240);
  lg.addColorStop(0, 'rgba(2,3,5,0)'); lg.addColorStop(0.45, 'rgba(2,3,5,0.48)'); lg.addColorStop(1, 'rgba(2,3,5,0.78)');
  x.fillStyle = lg; x.fillRect(0, 0, W, 240);
})();
const STARS = mkCanvas(W + 240, H + 160);
(() => {
  const s = STARS.getContext('2d'), r = mulberry32(31);
  for (let i = 0; i < 280; i++) {
    const big = r() < 0.08, a = big ? 0.34 + r() * 0.3 : 0.07 + r() * 0.2;
    s.fillStyle = `rgba(236,226,200,${a.toFixed(3)})`; s.beginPath(); s.arc(r() * STARS.width, r() * STARS.height, big ? 1.3 + r() * 0.9 : 0.6 + r() * 0.7, 0, TAU); s.fill();
  }
})();
const GRID = 96, GRIDC = mkCanvas(W + GRID * 2, H + GRID * 2);
(() => {
  const x = GRIDC.getContext('2d'), w = GRIDC.width, h = GRIDC.height;
  x.strokeStyle = 'rgb(229,207,149)'; x.lineWidth = 1; x.globalAlpha = 0.05; x.beginPath();
  for (let gx = 0.5; gx <= w; gx += GRID) { x.moveTo(gx, 0); x.lineTo(gx, h); }
  for (let gy = 0.5; gy <= h; gy += GRID) { x.moveTo(0, gy); x.lineTo(w, gy); }
  x.stroke();
  x.globalAlpha = 0.24; x.beginPath();
  for (let gx = 0.5; gx <= w; gx += GRID) for (let gy = 0.5; gy <= h; gy += GRID) { x.moveTo(gx - 4, gy); x.lineTo(gx + 4, gy); x.moveTo(gx, gy - 4); x.moveTo(gx, gy + 4); }
  x.stroke();
  x.globalAlpha = 1; x.globalCompositeOperation = 'destination-in';
  const rg = x.createRadialGradient(w / 2, h * 0.45, 180, w / 2, h * 0.45, w * 0.52);
  rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(0.55, 'rgba(0,0,0,0.55)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = rg; x.fillRect(0, 0, w, h);
})();
const BOK = (() => { const r = mulberry32(11), a = []; for (let i = 0; i < 28; i++) a.push({ x: r() * W, y: r() * H, s: 3 + Math.pow(r(), 2.2) * 24, a: 0.04 + r() * 0.14, vx: (r() - 0.5) * 14, vy: -3 - r() * 9, ph: r() * TAU }); return a; })();
const ORB = [{ rx: 980, ry: 270, a: 0.10, sp: 0.06, ph: 0.4 }, { rx: 720, ry: 198, a: 0.08, sp: -0.085, ph: 2.3 }];

function drawFilmBackdrop(t, camYaw = 0) {
  g.drawImage(BG, 0, 0);
  const ox = -((t * 6 + camYaw * 90) % 240 + 240) % 240;
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip();
  g.drawImage(STARS, ox, -40);
  const gx = ((t * 8 - camYaw * 120) % GRID + GRID) % GRID, gy = ((-t * 4) % GRID + GRID) % GRID;
  g.drawImage(GRIDC, gx - GRID * 1.5, gy - GRID * 1.5);
  // 慢转椭圆金线轨道
  const rot = -0.16 + t * 0.008, cr = Math.cos(rot), sr = Math.sin(rot);
  for (const o of ORB) {
    g.strokeStyle = rgba(C.gold, o.a); g.lineWidth = 1.1;
    g.beginPath(); g.ellipse(FX, FY + 30, o.rx, o.ry, rot, 0, TAU); g.stroke();
    const an = o.ph + t * o.sp, ex = Math.cos(an) * o.rx, ey = Math.sin(an) * o.ry;
    const sx = FX + ex * cr - ey * sr, sy = FY + 30 + ex * sr + ey * cr;
    g.drawImage(SPOT, sx - 22, sy - 22, 44, 44);
  }
  // 舞台中心暖金呼吸主光晕
  const breathe = 0.82 + 0.18 * Math.sin(t * 1.3);
  g.globalAlpha = breathe;
  g.drawImage(GLOW, FX - 680, FY - 430, 1360, 860);
  g.restore();
}

function drawBokehForeground(t) {
  g.save();
  for (const b of BOK) {
    let x = (b.x + b.vx * t) % (W + 80), y = (b.y + b.vy * t) % (H + 80);
    if (x < -40) x += W + 80; if (y < -40) y += H + 80;
    g.globalAlpha = b.a * (0.72 + 0.28 * Math.sin(t * 0.95 + b.ph));
    g.drawImage(BOKEH, x - b.s, y - b.s, b.s * 2, b.s * 2);
  }
  g.restore();
}

// ---------- 第 2 层：Three.js 电影黑金摄影棚舞台 ----------
const stage3D = Craft3D.createStage(glCv, {
  studio: 'cinemaGold',
  exposure: 1.02,
  fov: 35,
  shadows: true,
  ambientColor: 0xffe8c8,
  ambientIntensity: 0.34,
  keyColor: 0xfff0d4,
  keyIntensity: 2.05,
  fillColor: 0xe0b568,
  fillIntensity: 0.95,
  rimColor: 0x6f94c9,
  rimIntensity: 1.35,
});
const { renderer, scene, camera } = stage3D;

// 常驻黑曜石蚀刻星盘底座（承接真实投影，消除悬空塑料感）
const PEDESTAL = Craft3D.createStarPedestal(4.65);
PEDESTAL.position.y = -1.15;
scene.add(PEDESTAL);

const STAGE_GROUPS = SHOT_SRC.map(() => { const grp = new THREE.Group(); scene.add(grp); return grp; });
let _camYaw = 0;
function setCam3D(px, py, pz, lx = 0, ly = -0.15, lz = 0) {
  camera.position.set(px, py, pz);
  camera.lookAt(lx, ly, lz);
  camera.updateMatrixWorld();
  _camYaw = Math.atan2(px - lx, pz - lz);
}

// 3D→2D 纪录片级折线引线标注队列
let _callouts = [];
function callout3D(wx, wy, wz, title, progress = 1, opts = {}) {
  if (progress <= 0.01 || !title) return;
  _callouts.push({ wx, wy, wz, title, progress, opts });
}
function flushCallouts2D() {
  const mapped = _callouts.map((c) => ({
    wx: c.wx, wy: c.wy, wz: c.wz, title: c.title, progress: c.progress,
    opts: {
      fontMain: fcn(700, c.opts.size || 40),
      fontSub: fcn(500, 25),
      ...c.opts,
    },
  }));
  Craft3D.drawLeaderCalloutBatch(g, camera, mapped, {
    accent: C.gold,
    textCol: C.white,
    subCol: C.gray,
    minGap: 94,
  });
  _callouts = [];
}

// ---------- 第 3 层：左上里程表滚轮编号、右上角标、底部衬线逐字字幕 ----------
const shortTitle = (s) => { const a = String(s || ''), b = a.split(/[：:，,。！？!?]/)[0], u = b.length >= 2 ? b : a; return u.length > 12 ? u.slice(0, 11) + '…' : u; };
const STEPS = SHOT_SRC.map((s, i) => ({ n: String(i + 1).padStart(2, '0'), cn: shortTitle(s.title) || `镜头 ${i + 1}`, t: i === 0 ? 0 : s.start }));
const HUD_IN = TL.cues[0] ? TL.cues[0].show + 0.08 : 0.1;

function drawStepLabel(t) {
  const a = P(t, HUD_IN, 0.5); if (a <= 0) return;
  let k = 0; for (let i = 0; i < STEPS.length; i++) if (t >= STEPS[i].t) k = i;
  const x = 104, y = 108, f = flat(600, 92), lh = 106;
  g.save(); g.globalAlpha = a;
  let xx = x;
  const cur = STEPS[k], prev = k > 0 ? STEPS[k - 1] : null;
  for (let j = 0; j < cur.n.length; j++) {
    const dw = tw(cur.n[j], f) + 4;
    const roll = prev ? inOutC(P(t, cur.t + j * 0.07, 0.5)) : 1;
    g.save(); g.beginPath(); g.rect(xx - 6, y - 62, dw + 12, 114); g.clip();
    g.shadowColor = rgba(C.gold, 0.35); g.shadowBlur = 18;
    const drawDigit = (ch, dy, al) => {
      if (al <= 0) return;
      g.globalAlpha = a * al; g.font = f; g.textAlign = 'left'; g.textBaseline = 'middle';
      g.fillStyle = goldGrad(y - 38 + dy, y + 38 + dy);
      g.fillText(ch, xx, y + dy);
    };
    if (prev && prev.n[j] !== cur.n[j] && roll < 1) { drawDigit(prev.n[j], -roll * lh, 1 - roll); drawDigit(cur.n[j], (1 - roll) * lh, roll); }
    else drawDigit(cur.n[j], 0, 1);
    g.restore();
    xx += dw;
  }
  const lp = outC(P(t, HUD_IN + 0.15, 0.6));
  if (lp > 0) {
    const lg = g.createLinearGradient(x - 2, 0, x + 310, 0);
    lg.addColorStop(0, rgba(C.rule, 1)); lg.addColorStop(0.6, rgba(C.rule, 0.7)); lg.addColorStop(1, rgba(C.rule, 0));
    g.fillStyle = lg; g.fillRect(x - 2, y + 54, 310 * lp, 2);
  }
  revealText(cur.cn, x, y + 92, fcn(600, 32), C.cream, t, k === 0 ? HUD_IN + 0.25 : cur.t + 0.15, { align: 'left', stag: 0.04, dur: 0.22 });
  g.restore();
}

function drawCorner(t) {
  if (!TL.title) return;
  const a = P(t, HUD_IN + 0.25, 0.6); if (a <= 0) return;
  const f = fcn(500, 29), lw = Math.max(240, Math.min(900, tw(TL.title, f)));
  g.save(); g.globalAlpha = a;
  revealText(TL.title, 1816, 76, f, C.gray, t, HUD_IN + 0.25, { align: 'right', stag: 0.02 });
  const lg = g.createLinearGradient(1816, 0, 1816 - lw, 0); lg.addColorStop(0, rgba(C.rule, 1)); lg.addColorStop(1, rgba(C.rule, 0));
  g.fillStyle = lg; g.fillRect(1816 - lw, 102, lw * outC(P(t, HUD_IN + 0.45, 0.6)), 1.5);
  g.restore();
}

// 字幕分词高亮与印章底
const SUB_TOK = [];
for (const h of TL.highlights || []) if (h.text) SUB_TOK.push({ t: h.text, k: ROLE_KIND[h.role] || 'red' });
for (const e of TL.emphasis || []) if (e && !SUB_TOK.some((x) => x.t === e)) SUB_TOK.push({ t: e, k: 'g' });
SUB_TOK.sort((a, b) => b.t.length - a.t.length);
function subSegs(str) {
  const segs = []; let i = 0, plain = '';
  while (i < str.length) {
    let hit = null;
    for (const tk of SUB_TOK) if (str.startsWith(tk.t, i)) { hit = tk; break; }
    if (hit) { if (plain) { segs.push({ s: plain, k: 'n' }); plain = ''; } segs.push({ s: hit.t, k: hit.k }); i += hit.t.length; }
    else { plain += str[i]; i++; }
  }
  if (plain) segs.push({ s: plain, k: 'n' });
  return segs;
}
function sealBlock(x, y, w, h, kind, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x + w / 2, y + h / 2);
  if (kind === 'red') {
    g.fillStyle = C.redDk; rrect(-w / 2, -h / 2 + 2, w, h, 6); g.fill();
    g.fillStyle = C.red; rrect(-w / 2, -h / 2, w, h, 6); g.fill();
    g.strokeStyle = rgba(C.redLn, 0.55); g.lineWidth = 1.5; rrect(-w / 2 + 4, -h / 2 + 4, w - 8, h - 8, 3); g.stroke();
  } else {
    g.fillStyle = C.coin5; rrect(-w / 2, -h / 2 + 2, w, h, 6); g.fill();
    g.fillStyle = coinGrad(-h / 2, h / 2); rrect(-w / 2, -h / 2, w, h, 6); g.fill();
    g.strokeStyle = rgba(C.ink, 0.35); g.lineWidth = 1.5; rrect(-w / 2 + 4, -h / 2 + 4, w - 8, h - 8, 3); g.stroke();
  }
  g.restore();
}
function drawSubtitle(t) {
  if (NOSUB) return;
  const c = TL.cueAt(t); if (!c) return;
  const k = TL.cues.indexOf(c), jump = k > 0 && TL.cues[k - 1].hide >= c.show - 1e-3;
  const segs = subSegs(c.text), f = fcn(900, 64), y = 992;
  const total = segs.reduce((s, sg) => s + tw(sg.s, f) + (sg.k === 'red' || sg.k === 'gold' ? 20 : 0), 0);
  const stag = Math.min(0.03, 0.34 / Math.max(1, c.text.length)), dur = 0.2;
  let x = W / 2 - total / 2, ci = 0;
  g.save(); g.font = f; g.textBaseline = 'middle'; g.textAlign = 'left';
  for (const sg of segs) {
    const blockW = tw(sg.s, f) + (sg.k === 'red' || sg.k === 'gold' ? 20 : 0);
    if (sg.k === 'red' || sg.k === 'gold') {
      const p = jump ? 1 : outC(P(t, c.show + ci * stag, dur + 0.05));
      sealBlock(x, y - 40, blockW, 80, sg.k, p);
    }
    let xx = x + (sg.k === 'red' || sg.k === 'gold' ? 10 : 0);
    for (const ch of sg.s) {
      const p = jump ? 1 : outC(P(t, c.show + ci * stag, dur));
      if (p > 0) {
        g.globalAlpha = p;
        g.fillStyle = sg.k === 'red' ? C.redTx : sg.k === 'gold' ? C.ink : sg.k === 'g' ? C.gold : C.cream;
        g.shadowColor = sg.k === 'g' ? rgba(C.gold, 0.5) : sg.k === 'n' ? 'rgba(0,0,0,0.85)' : 'transparent';
        g.shadowBlur = sg.k === 'g' ? 16 : sg.k === 'n' ? 10 : 0;
        if (p < 0.98) g.filter = `blur(${((1 - p) * 6).toFixed(2)}px)`;
        g.fillText(ch, xx, y + 2 + (1 - p) * 7);
        g.filter = 'none';
      }
      xx += tw(ch, f); ci++;
    }
    x += blockW;
  }
  g.restore();
}

function drawCutFlash(t) {
  for (let i = 1; i < SHOT_SRC.length; i++) {
    const c = SHOT_SRC[i].start, v = bump(t, c - 0.1, 0.26);
    if (v > 0) {
      g.save(); g.globalAlpha = 0.35 * v; g.fillStyle = '#f3e5c4'; g.fillRect(0, 0, W, H); g.restore();
    }
  }
}

let SHOTS = [];
function initShotsMeta() {
  SHOTS = SHOT_SRC.map((s, i) => ({
    s, i,
    start: i === 0 ? 0 : s.start,
    end: SHOT_SRC[i + 1] ? SHOT_SRC[i + 1].start : TL.duration,
    next: SHOT_SRC[i + 1] || null,
    title: s.title || '',
    keywords: s.keywords || [],
  }));
}
function shotAt(t) {
  let k = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i].start) k = i;
  return SHOTS[k];
}

// ===== 场景：按新分镜重写（buildScene3D 初始化一次 + updateShot3D 逐帧纯函数更新，严禁使用 += 累加） =====
let _built3D = false;
function buildScene3D() {
  SHOTS.forEach((sh, i) => {
    const grp = STAGE_GROUPS[i];
    const useChamber = (i % 2 === 1);
    let centerUnit;
    if (useChamber) {
      centerUnit = Craft3D.createCutawayChamber({ radius: 1.18, height: 2.08 });
      centerUnit.position.y = 0.08;
    } else {
      centerUnit = Craft3D.createGyroCore(1.15, { accentRed: false });
      centerUnit.position.y = 0.15;
    }
    grp.add(centerUnit);

    const kws = (sh.keywords || []).filter(Boolean);
    const chips = [];
    const n = Math.max(1, kws.length);
    kws.forEach((w, j) => {
      const kind = kindOf(w);
      const a = (j / n) * TAU - Math.PI * 0.35;
      const rx = 2.95, rz = 2.20;
      const tx = Math.cos(a) * rx, tz = Math.sin(a) * rz;
      const chip = Craft3D.createChipTile(1.08, 0.26, 0.88, kind);
      chip.position.set(tx, -0.55, tz);
      grp.add(chip);

      const stream = Craft3D.createShaderStream(
        [[tx, -0.38, tz], [tx * 0.48, 0.78, tz * 0.48], [0, 0.12, 0]],
        {
          color: kind === 'red' ? 0xe85243 : 0xf5d792,
          radius: 0.038,
          pulses: 3.5,
          speed: 1.4,
        }
      );
      grp.add(stream);
      chips.push({ w, kind, chip, stream, tx, tz, a, t0: MS(w, sh.start + 0.25 + j * 0.45) });
    });
    grp.userData = { useChamber, centerUnit, chips };
  });
}

function updateShot3D(sh, t, u) {
  const { useChamber, centerUnit, chips } = STAGE_GROUPS[sh.i].userData;
  const camA = -0.35 + u * 0.68 + sh.i * 0.32;
  const dist = lerp(10.5, 8.8, inOutC(u));
  const camY = lerp(3.2, 2.35, sine(u));
  setCam3D(Math.sin(camA) * dist, camY, Math.cos(camA) * dist, 0, -0.05, 0);
  stage3D.setCrop(useChamber ? (1 + 0.14 * sine(u)) : 1, W * 0.5, H * 0.46);

  if (useChamber) {
    centerUnit.rotation.y = camA * 0.65;
    centerUnit.userData.update(t, inOutC(clamp((u - 0.08) / 0.52)), 1.0);
  } else {
    centerUnit.userData.spin(t, 1.0);
  }
  chips.forEach((c, j) => {
    const p = outBack(P(t, c.t0 - 0.08, 0.42));
    c.chip.scale.setScalar(Math.max(0.001, p));
    c.chip.position.y = -0.55 + Math.sin(t * 2.1 + j) * 0.06;
    c.chip.rotation.y = -c.a + Math.sin(t * 0.8 + j) * 0.08;
    c.stream.userData.update(t, clamp(P(t, c.t0 + 0.1, 0.45), 0, 1), 1.25);
    callout3D(c.tx, -0.15, c.tz, c.w, P(t, c.t0, 0.38), {
      badge: c.kind === 'red' || c.kind === 'gold' ? c.kind : null,
      dy: -68 - (j % 2) * 32,
    });
  });
}
// ===== 场景结束 =====

function render(t) {
  if (!SHOTS.length) initShotsMeta();
  if (!_built3D) { buildScene3D(); _built3D = true; }
  _callouts = [];

  const sh = shotAt(t);
  const dur = Math.max(0.4, sh.end - sh.start);
  const u = P(t, sh.start, dur);

  // 星盘底座刻度环持续优雅微转
  PEDESTAL.userData.outerRing.rotation.y = t * 0.06;
  PEDESTAL.userData.innerRing.rotation.y = -t * 0.11;

  STAGE_GROUPS.forEach((grp, idx) => { grp.visible = (idx === sh.i); });
  updateShot3D(sh, t, u);
  renderer.render(scene, camera);

  // 三明治合成：胶片底 → WebGL + 双层光学泛光 → 折线引线 → 散景光斑与暗角 → 页眉与字幕
  resetCtx(g);
  drawFilmBackdrop(t, _camYaw);
  Craft3D.compositeBloom(g, glCv, { strength: 0.46 });
  flushCallouts2D();
  drawBokehForeground(t);
  g.drawImage(VIG, 0, 0);
  if (!NOSUB) g.drawImage(SUBBAND, 0, H - 240);
  drawStepLabel(t);
  drawCorner(t);
  drawSubtitle(t);
  if (FX_DEFAULT) drawCutFlash(t);
}

window.DURATION = TL.duration;
window.ready = false;
window.seek = (t) => render(t);
Promise.all([fcn(900, 64), fcn(700, 40), fcn(500, 30), flat(600, 92)].map((f) => document.fonts.load(f, '字幕Ag01')))
  .catch(() => {}).then(() => { initShotsMeta(); render(0); window.ready = true; });
</script>
